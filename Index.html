<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: <?= PRIMARY_COLOR ?>;
      --secondary: <?= SECONDARY_COLOR ?>;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --muted: #6b7785;
      --border: #e0e0e0;
      --danger: #c62828;
      --warn-bg: #fff8e1;
      --warn-border: #f3d27a;
    }

    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: 'Roboto', Arial, sans-serif;
      background: var(--bg); color: var(--text);
    }
    body { display: flex; flex-direction: column; }

    .sn-header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      flex-shrink: 0;
    }
    .header-container { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .header-brand { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .header-logo { height: 28px; width: 28px; object-fit: contain; flex-shrink: 0; }
    .header-title { font-weight: 700; font-size: 14px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .lang-bar select {
      font-size: 11px; padding: 3px 4px;
      border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: #fff;
    }

    .main-container {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      flex-shrink: 0;
    }
    .card-title { font-weight: 700; font-size: 12px; margin: 0 0 10px; color: var(--muted); }

    .onboard { background: var(--warn-bg); border-color: var(--warn-border); }
    .onboard h2 { font-size: 13px; margin: 0 0 4px; color: var(--text); }
    .onboard p { font-size: 11px; line-height: 1.45; margin: 0 0 8px; color: var(--text); }

    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .btn-grid.single { grid-template-columns: 1fr; }

    .btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 6px;
      font-family: inherit; font-size: 11px; font-weight: 500;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--bg); border-color: var(--primary); }
    .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--primary); outline-offset: 1px;
    }
    .btn:disabled { opacity: 0.5; cursor: progress; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary); filter: brightness(0.92); }

    .form-group { margin-bottom: 8px; }
    .form-group > label { display: block; font-size: 11px; font-weight: 500; margin-bottom: 3px; }

    .form-control {
      width: 100%; padding: 7px; border: 1px solid var(--border);
      border-radius: 6px; box-sizing: border-box;
      font-family: inherit; font-size: 12px; background: #fff;
    }
    textarea.form-control { resize: vertical; min-height: 46px; }

    .toggle-container { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; cursor: pointer; }

    .custom-prompt-box {
      margin-top: 7px; padding: 7px;
      background: var(--bg); border-radius: 6px;
      border: 1px dashed var(--border);
    }
    .custom-prompt-box label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 3px; }

    .audio-actions { display: flex; gap: 7px; }
    .audio-actions .btn { flex: 1; }

    .hidden-element { display: none !important; }

    #status {
      flex-shrink: 0;
      padding: 8px 12px;
      background: #fff;
      border-top: 1px solid var(--border);
      font-size: 11px; font-weight: 500;
      color: var(--muted); text-align: center;
      line-height: 1.4;
      max-height: 90px; overflow-y: auto;
    }
    #status.is-error { color: var(--danger); text-align: left; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <header class="sn-header">
    <div class="header-container">
      <div class="header-brand">
        <? if (LOGO_URL) { ?>
          <img class="header-logo" src="<?= LOGO_URL ?>" alt="">
        <? } else { ?> <h1>NESSIE</h1><? } ?>
        <span class="header-title"><?= APP_NAME ?></span>
      </div>
      <div class="lang-bar">
        <select id="langSelect" aria-label="Idioma / Language" onchange="switchLanguage(this.value)">
          <option value="pt">🇧🇷 PT</option>
          <option value="en">🇬🇧 EN</option>
          <option value="es">🇪🇸 ES</option>
        </select>
      </div>
    </div>
  </header>

  <main class="main-container">

    <section id="onboardCard" class="card onboard hidden-element" aria-live="polite">
      <h2 id="t-onboard-title"></h2>
      <p id="t-onboard-text"></p>
      <button class="btn btn-primary" type="button" onclick="openSettings()" id="t-btn-open-settings"></button>
    </section>

    <section class="card">
      <h2 class="card-title" id="t-section-pedagogical"></h2>

      <div class="form-group">
        <label class="toggle-container">
          <input type="checkbox" id="includeGlossary" checked>
          <span id="t-toggle-glossary"></span>
        </label>
      </div>

      <div class="form-group">
        <label class="toggle-container">
          <input type="checkbox" id="toggleCustomPrompt" onchange="toggleCustomPromptView(this.checked)">
          <span id="t-toggle-custom"></span>
        </label>
        <div id="customPromptWrapper" class="custom-prompt-box hidden-element">
          <label for="customPromptText" id="t-custom-label"></label>
          <textarea id="customPromptText" class="form-control" maxlength="1000"></textarea>
        </div>
      </div>

      <div class="btn-grid">
        <button class="btn" type="button" data-action="A1"        id="t-btn-a1"></button>
        <button class="btn" type="button" data-action="A2"        id="t-btn-a2"></button>
        <button class="btn" type="button" data-action="B1"        id="t-btn-b1"></button>
        <button class="btn" type="button" data-action="B2"        id="t-btn-b2"></button>
        <button class="btn" type="button" data-action="C1"        id="t-btn-c1"></button>
        <button class="btn" type="button" data-action="C2"        id="t-btn-c2"></button>
        <button class="btn" type="button" data-action="ASD"       id="t-btn-asd"></button>
        <button class="btn" type="button" data-action="CHALLENGE" id="t-btn-challenge"></button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" id="t-section-visual"></h2>
      <div class="btn-grid single">
        <button class="btn" type="button" data-action="MAKE_VISUAL" id="t-btn-visual"></button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" id="t-section-typo"></h2>
      <div class="btn-grid">
        <button class="btn" type="button" data-action="PUNCTUATION"        id="t-btn-punctuation"></button>
        <button class="btn" type="button" data-action="HIGHLIGHT_COMMANDS" id="t-btn-commands"></button>
        <button class="btn" type="button" data-action="ADHD"               id="t-btn-adhd"></button>
        <button class="btn" type="button" data-action="DYSLEXIA"           id="t-btn-dyslexia"></button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" id="t-section-audio"></h2>
      <div class="form-group">
        <label for="voiceSelect" id="t-audio-voice-label"></label>
        <select id="voiceSelect" class="form-control"></select>
      </div>
      <div class="form-group">
        <label id="rateLabel" for="speedRate"></label>
        <input type="range" id="speedRate" min="0.5" max="2.0" step="0.1" value="1.0"
               class="form-control" style="padding:0;" oninput="updateRateLabel(this.value)">
      </div>
      <div class="audio-actions">
        <button class="btn btn-primary" type="button" onclick="readSelection()" id="t-btn-play"></button>
        <button class="btn" type="button" onclick="stopSpeech()" id="t-btn-stop"></button>
      </div>
    </section>

  </main>

  <div id="status" role="status" aria-live="polite"></div>

  <script>
    /* ── Boot data (injected server-side) ─────────────────────────────────── */
    var BOOT = <?!= BOOT_JSON ?>;
    var _I18N = BOOT.i18n;
    var _locale = BOOT.locale || BOOT.defaultLocale;
    var _busy = false;
    var _statusTimer = null;
    var _keyWatchTimer = null;

    var AI_ACTIONS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'ASD', 'CHALLENGE', 'MAKE_VISUAL'];

    function _t(key, params) {
      var entry = _I18N[key];
      var text = entry ? (entry[_locale] || entry[BOOT.defaultLocale] || key) : key;
      if (params) {
        Object.keys(params).forEach(function (name) {
          text = text.split('{' + name + '}').join(String(params[name]));
        });
      }
      return text;
    }

    /* ── Translations ─────────────────────────────────────────────────────── */
    var _DOM_MAP = [
      { id: 't-onboard-title',       key: 'ONBOARD_TITLE' },
      { id: 't-onboard-text',        key: 'ONBOARD_TEXT' },
      { id: 't-btn-open-settings',   key: 'BTN_OPEN_SETTINGS' },
      { id: 't-section-pedagogical', key: 'SECTION_PEDAGOGICAL' },
      { id: 't-section-visual',      key: 'SECTION_VISUAL' },
      { id: 't-section-typo',        key: 'SECTION_TYPO' },
      { id: 't-section-audio',       key: 'SECTION_AUDIO' },
      { id: 't-toggle-glossary',     key: 'TOGGLE_GLOSSARY' },
      { id: 't-toggle-custom',       key: 'TOGGLE_CUSTOM_PROMPT' },
      { id: 't-custom-label',        key: 'CUSTOM_PROMPT_LABEL' },
      { id: 't-btn-a1',              key: 'BTN_A1' },
      { id: 't-btn-a2',              key: 'BTN_A2' },
      { id: 't-btn-b1',              key: 'BTN_B1' },
      { id: 't-btn-b2',              key: 'BTN_B2' },
      { id: 't-btn-c1',              key: 'BTN_C1' },
      { id: 't-btn-c2',              key: 'BTN_C2' },
      { id: 't-btn-asd',             key: 'BTN_ASD' },
      { id: 't-btn-challenge',       key: 'BTN_CHALLENGE' },
      { id: 't-btn-visual',          key: 'BTN_MAKE_VISUAL', prefix: '📊 ' },
      { id: 't-btn-punctuation',     key: 'BTN_PUNCTUATION', prefix: '🔍 ' },
      { id: 't-btn-commands',        key: 'BTN_COMMANDS',    prefix: '📋 ' },
      { id: 't-btn-adhd',            key: 'BTN_ADHD',        prefix: '🧠 ' },
      { id: 't-btn-dyslexia',        key: 'BTN_DYSLEXIA',    prefix: '📖 ' },
      { id: 't-audio-voice-label',   key: 'AUDIO_VOICE_LABEL' },
      { id: 't-btn-play',            key: 'BTN_PLAY',        prefix: '🔊 ' },
      { id: 't-btn-stop',            key: 'BTN_STOP',        prefix: '⏹ ' }
    ];

    function applyTranslations() {
      document.documentElement.lang = _locale === 'pt' ? 'pt-BR' : _locale;
      _DOM_MAP.forEach(function (m) {
        var el = document.getElementById(m.id);
        if (el) {
          el.textContent = (m.prefix || '') + _t(m.key);
          if (el.tagName === 'BUTTON') el.title = _t(m.key);
        }
      });
      document.getElementById('customPromptText').placeholder = _t('CUSTOM_PROMPT_PLACEHOLDER');
      document.getElementById('langSelect').value = _locale;
      updateRateLabel(document.getElementById('speedRate').value);
      if (!_busy) setStatus(_t('STATUS_READY'));
      loadVoices();
    }

    function switchLanguage(locale) {
      _locale = locale;
      applyTranslations();
      google.script.run
        .withFailureHandler(function (err) { showError(err); })
        .saveSettings({ locale: locale });
    }

    /* ── Status / errors ──────────────────────────────────────────────────── */
    function setStatus(msg, isError) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = isError ? 'is-error' : '';
    }

    function flashStatus(msg) {
      setStatus(msg);
      clearTimeout(_statusTimer);
      _statusTimer = setTimeout(function () { if (!_busy) setStatus(_t('STATUS_READY')); }, 3000);
    }

    function parseServerError(err) {
      var raw = (err && err.message) ? err.message : String(err);
      var match = raw.match(/\[([A-Z_]+)\]\s*/);
      if (!match) return { code: '', text: raw.replace(/^(Exception|Error):\s*/i, '') };
      return { code: match[1], text: raw.slice(match.index + match[0].length) };
    }

    function showError(err) {
      var parsed = parseServerError(err);
      clearTimeout(_statusTimer);
      setStatus(parsed.text, true);
      if (parsed.code === 'API_KEY_MISSING' || parsed.code === 'API_KEY_INVALID') setOnboardVisible(true);
    }

    /* ── Onboarding ───────────────────────────────────────────────────────── */
    function setOnboardVisible(visible) {
      document.getElementById('onboardCard').classList.toggle('hidden-element', !visible);
    }

    function openSettings() {
      google.script.run
        .withSuccessHandler(watchForSettingsChange)
        .withFailureHandler(showError)
        .showSettingsDialog();
    }

    // The modal cannot notify the sidebar directly, so poll briefly after opening it.
    function watchForSettingsChange() {
      clearInterval(_keyWatchTimer);
      var attempts = 0;
      _keyWatchTimer = setInterval(function () {
        attempts++;
        if (attempts > 60) { clearInterval(_keyWatchTimer); return; }
        google.script.run
          .withSuccessHandler(function (settings) {
            if (!settings) return;
            if (settings.locale && settings.locale !== _locale) {
              _locale = settings.locale;
              applyTranslations();
            }
            if (settings.hasApiKey) {
              setOnboardVisible(false);
              if (document.getElementById('status').className === 'is-error') setStatus(_t('STATUS_READY'));
              clearInterval(_keyWatchTimer);
            }
          })
          .getSettings();
      }, 3000);
    }

    /* ── Adaptation runner ────────────────────────────────────────────────── */
    function setBusy(busy) {
      _busy = busy;
      var buttons = document.querySelectorAll('[data-action]');
      for (var i = 0; i < buttons.length; i++) buttons[i].disabled = busy;
    }

    function runAdaptation(action) {
      if (_busy) return;
      var includeGlossary = document.getElementById('includeGlossary').checked;
      var customOn = document.getElementById('toggleCustomPrompt').checked;
      var customVal = customOn ? document.getElementById('customPromptText').value.trim() : '';

      setBusy(true);
      clearTimeout(_statusTimer);
      setStatus(_t(AI_ACTIONS.indexOf(action) !== -1 ? 'STATUS_PROCESSING_AI' : 'STATUS_PROCESSING'));

      google.script.run
        .withSuccessHandler(function () {
          setBusy(false);
          flashStatus(_t('STATUS_DONE'));
        })
        .withFailureHandler(function (err) {
          setBusy(false);
          showError(err);
        })
        .processAdaptation(action, includeGlossary, customVal);
    }

    function toggleCustomPromptView(on) {
      var box = document.getElementById('customPromptWrapper');
      box.classList.toggle('hidden-element', !on);
      if (!on) document.getElementById('customPromptText').value = '';
    }

    function updateRateLabel(val) {
      document.getElementById('rateLabel').textContent = _t('AUDIO_SPEED_LABEL') + ' ' + parseFloat(val).toFixed(1) + 'x';
    }

    /* ── Text-to-speech ───────────────────────────────────────────────────── */
    var _voices = [];

    function voiceScore(voice) {
      var prefixes = (BOOT.ttsPrefixes && BOOT.ttsPrefixes[_locale]) || [];
      var lang = String(voice.lang || '').replace('_', '-').toLowerCase();
      for (var i = 0; i < prefixes.length; i++) {
        if (lang.indexOf(prefixes[i].toLowerCase()) === 0) return prefixes.length - i;
      }
      return 0;
    }

    function isHighQuality(voice) {
      return /(Natural|Google|Premium|Enhanced|Neural)/i.test(voice.name) ? 1 : 0;
    }

    function loadVoices() {
      var sel = document.getElementById('voiceSelect');
      if (!sel) return;

      if (typeof window.speechSynthesis === 'undefined') {
        sel.innerHTML = '';
        sel.appendChild(new Option(_t('STATUS_NO_TTS'), ''));
        return;
      }

      _voices = window.speechSynthesis.getVoices() || [];
      var previous = sel.value;
      sel.innerHTML = '';

      if (!_voices.length) {
        sel.appendChild(new Option(_t('AUDIO_SCANNING'), ''));
        return;
      }

      var matching = _voices.filter(function (v) { return voiceScore(v) > 0; });
      var pool = (matching.length ? matching : _voices.slice()).sort(function (a, b) {
        return (voiceScore(b) - voiceScore(a)) || (isHighQuality(b) - isHighQuality(a)) || a.name.localeCompare(b.name);
      });

      pool.forEach(function (voice) {
        var label = voice.name + ' (' + voice.lang + ')' + (isHighQuality(voice) ? ' ★' : '');
        sel.appendChild(new Option(label, voice.name));
      });

      var keep = pool.some(function (v) { return v.name === previous; });
      sel.value = keep ? previous : pool[0].name;
    }

    if (typeof window.speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function readSelection() {
      if (typeof window.speechSynthesis === 'undefined') { setStatus(_t('STATUS_NO_TTS'), true); return; }
      window.speechSynthesis.cancel();

      var speed = parseFloat(document.getElementById('speedRate').value) || 1.0;
      var voiceName = document.getElementById('voiceSelect').value;

      google.script.run
        .withSuccessHandler(function (text) {
          if (!text || !text.trim()) { flashStatus(_t('STATUS_SELECT_TEXT')); return; }
          var utterance = new SpeechSynthesisUtterance(text);
          var voice = _voices.filter(function (v) { return v.name === voiceName; })[0];
          if (voice) { utterance.voice = voice; utterance.lang = voice.lang; }
          utterance.rate = speed;
          utterance.onstart = function () { setStatus(_t('STATUS_READING')); };
          utterance.onend = function () { setStatus(_t('STATUS_READY')); };
          utterance.onerror = function (e) {
            if (e.error === 'interrupted' || e.error === 'canceled') return;
            setStatus(_t('STATUS_TTS_ERROR', { error: e.error }), true);
          };
          window.speechSynthesis.speak(utterance);
        })
        .withFailureHandler(showError)
        .getSelectedTextForTTS();
    }

    function stopSpeech() {
      if (typeof window.speechSynthesis !== 'undefined') window.speechSynthesis.cancel();
      flashStatus(_t('STATUS_STOPPED'));
    }

    /* ── Boot ─────────────────────────────────────────────────────────────── */
    document.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function () { runAdaptation(btn.getAttribute('data-action')); });
    });

    applyTranslations();
    setOnboardVisible(!BOOT.hasApiKey);
  </script>
</body>
</html>
